<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1310" width="1440" height="1310" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#059669"/></marker>
    <marker id="ay" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="1440" height="1310" fill="#ffffff"/>
  <text x="657" y="52" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold">vLLM V1 Architecture</text>
  <text x="657" y="80" font-size="13.5" fill="#475569" text-anchor="middle">frontend (API server / offline)  and  EngineCore (ZMQ)  and  GPU workers</text>
  <rect x="60" y="100" width="1320" height="95" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="76" y="124" font-size="13" font-weight="bold" fill="#334155" letter-spacing="0.4">Entrypoints</text>
  <rect x="170" y="124" width="360" height="52" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="350.0" y="148" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">LLM class</text>
  <text x="350.0" y="169" font-size="11" fill="#475569" text-anchor="middle">offline inference  -  vllm/entrypoints/llm.py</text>
  <rect x="910" y="124" width="360" height="52" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="1090.0" y="148" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">OpenAI-compatible API Server</text>
  <text x="1090.0" y="169" font-size="11" fill="#475569" text-anchor="middle">vllm serve  -  entrypoints/launchers/api_server</text>
  <rect x="60" y="225" width="1320" height="375" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="76" y="249" font-size="13" font-weight="bold" fill="#334155" letter-spacing="0.4">Frontend  -  engine clients  (API server process for vllm serve / user process for offline LLM)</text>
  <rect x="170" y="252" width="360" height="93" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="350.0" y="276" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">LLMEngine   (sync)</text>
  <text x="350.0" y="297" font-size="11" fill="#475569" text-anchor="middle">add_request() + step() loop</text>
  <text x="350.0" y="313.5" font-size="11" fill="#475569" text-anchor="middle">vllm/v1/engine/llm_engine.py</text>
  <text x="350.0" y="330.0" font-size="11" fill="#475569" text-anchor="middle">shim: vllm/engine/llm_engine.py</text>
  <rect x="910" y="252" width="360" height="93" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="1090.0" y="276" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">AsyncLLM   =   AsyncLLMEngine</text>
  <text x="1090.0" y="297" font-size="11" fill="#475569" text-anchor="middle">async generate()  -  output_handler task</text>
  <text x="1090.0" y="313.5" font-size="11" fill="#475569" text-anchor="middle">vllm/v1/engine/async_llm.py</text>
  <text x="1090.0" y="330.0" font-size="11" fill="#475569" text-anchor="middle">shim: vllm/engine/async_llm_engine.py</text>
  <rect x="170" y="363" width="360" height="102" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="350.0" y="387" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Renderer + Input/Output processing</text>
  <text x="350.0" y="408" font-size="11" fill="#475569" text-anchor="middle">renderer: tokenize + multimodal</text>
  <text x="350.0" y="424.5" font-size="11" fill="#475569" text-anchor="middle">-> EngineCoreRequest</text>
  <text x="350.0" y="441.0" font-size="11" fill="#475569" text-anchor="middle">output_processor: EngineCoreOutput</text>
  <text x="350.0" y="457.5" font-size="11" fill="#475569" text-anchor="middle">-> RequestOutput</text>
  <rect x="910" y="363" width="360" height="102" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="1090.0" y="387" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Renderer + Input/Output processing</text>
  <text x="1090.0" y="408" font-size="11" fill="#475569" text-anchor="middle">renderer: tokenize + multimodal</text>
  <text x="1090.0" y="424.5" font-size="11" fill="#475569" text-anchor="middle">-> EngineCoreRequest</text>
  <text x="1090.0" y="441.0" font-size="11" fill="#475569" text-anchor="middle">output_processor: EngineCoreOutput</text>
  <text x="1090.0" y="457.5" font-size="11" fill="#475569" text-anchor="middle">-> RequestOutput</text>
  <rect x="170" y="483" width="360" height="97" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="350.0" y="507" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">EngineCoreClient   (sync ZMQ)</text>
  <text x="350.0" y="528" font-size="11" fill="#475569" text-anchor="middle">make_client(asyncio_mode=False)</text>
  <text x="350.0" y="544.5" font-size="11" fill="#475569" text-anchor="middle">InprocClient (uniproc)</text>
  <text x="350.0" y="561.0" font-size="11" fill="#475569" text-anchor="middle">SyncMPClient (multiproc)</text>
  <rect x="910" y="483" width="360" height="97" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="1090.0" y="507" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">EngineCoreClient   (async ZMQ)</text>
  <text x="1090.0" y="528" font-size="11" fill="#475569" text-anchor="middle">make_async_mp_client()</text>
  <text x="1090.0" y="544.5" font-size="11" fill="#475569" text-anchor="middle">AsyncMPClient</text>
  <text x="1090.0" y="561.0" font-size="11" fill="#475569" text-anchor="middle">talks to one or more EngineCore procs</text>
  <text x="1090.0" y="576.0" font-size="10" fill="#4f46e5" text-anchor="middle">sockets: ROUTER (send req) + PULL (recv out)</text>
  <rect x="60" y="645" width="1195" height="40" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="657" y="664" font-size="13" fill="#78350f" text-anchor="middle" font-weight="bold">ZMQ transport   -   requests: frontend ROUTER  to  core DEALER   |   outputs: core PUSH  to  frontend PULL</text>
  <text x="657" y="679" font-size="10.5" fill="#92400e" text-anchor="middle">DP coordinator stats use XPUB to XSUB; first-request handshake uses PAIR; NO ZMQ on the tensor path (NCCL / shared memory)</text>
  <rect x="60" y="725" width="1195" height="200" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="76" y="749" font-size="13" font-weight="bold" fill="#334155" letter-spacing="0.4">EngineCore process  -  1 per DP rank  -  busy loop: schedule -> execute -> collect</text>
  <rect x="85" y="758" width="370" height="132" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="270.0" y="782" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Scheduler</text>
  <text x="270.0" y="803" font-size="11" fill="#475569" text-anchor="middle">unified token budget {req_id: num_tokens}</text>
  <text x="270.0" y="819.5" font-size="11" fill="#475569" text-anchor="middle">FCFS / priority policy</text>
  <text x="270.0" y="836.0" font-size="11" fill="#475569" text-anchor="middle">chunked prefill + prefix caching</text>
  <text x="270.0" y="852.5" font-size="11" fill="#475569" text-anchor="middle">spec decode (no prefill/decode split)</text>
  <rect x="475" y="758" width="370" height="132" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="660.0" y="782" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">KVCacheManager + BlockPool</text>
  <text x="660.0" y="803" font-size="11" fill="#475569" text-anchor="middle">paged KV cache blocks</text>
  <text x="660.0" y="819.5" font-size="11" fill="#475569" text-anchor="middle">free block queue</text>
  <text x="660.0" y="836.0" font-size="11" fill="#475569" text-anchor="middle">no GPU/CPU KV swap</text>
  <text x="660.0" y="852.5" font-size="11" fill="#475569" text-anchor="middle">preemption = recompute</text>
  <rect x="865" y="758" width="370" height="132" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1050.0" y="782" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Executor</text>
  <text x="1050.0" y="803" font-size="11" fill="#475569" text-anchor="middle">MultiprocExecutor / UniProcExecutor</text>
  <text x="1050.0" y="819.5" font-size="11" fill="#475569" text-anchor="middle">dispatches steps to workers</text>
  <text x="1050.0" y="836.0" font-size="11" fill="#475569" text-anchor="middle">collects EngineCoreOutputs</text>
  <text x="1050.0" y="852.5" font-size="11" fill="#475569" text-anchor="middle">DP sync for MoE (via coordinator)</text>
  <rect x="1290" y="758" width="110" height="132" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="1345.0" y="782" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">DP</text>
  <text x="1345.0" y="803" font-size="11" fill="#475569" text-anchor="middle">Coordinator</text>
  <text x="1345.0" y="819.5" font-size="11" fill="#475569" text-anchor="middle">separate proc</text>
  <text x="1345.0" y="836.0" font-size="11" fill="#475569" text-anchor="middle">only if DP > 1</text>
  <line x1="1290" y1="824" x2="1260" y2="824" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ay)"/>
  <text x="1275" y="812" font-size="10" fill="#6b7280" text-anchor="middle">DP>1</text>
  <rect x="60" y="960" width="1195" height="170" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="76" y="984" font-size="13" font-weight="bold" fill="#334155" letter-spacing="0.4">GPU worker processes  -  1 per GPU  -  count = DP x PP x TP</text>
  <rect x="85" y="995" width="370" height="110" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="270.0" y="1019" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Worker</text>
  <text x="270.0" y="1040" font-size="11" fill="#475569" text-anchor="middle">vllm/v1/worker/gpu_worker.py</text>
  <text x="270.0" y="1056.5" font-size="11" fill="#475569" text-anchor="middle">loads weights, owns device memory</text>
  <text x="270.0" y="1073.0" font-size="11" fill="#475569" text-anchor="middle">one process per GPU</text>
  <rect x="475" y="995" width="370" height="110" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="660.0" y="1019" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">GPUModelRunner</text>
  <text x="660.0" y="1040" font-size="11" fill="#475569" text-anchor="middle">MRV1: vllm/v1/worker/gpu_model_runner.py</text>
  <text x="660.0" y="1056.5" font-size="11" fill="#475569" text-anchor="middle">MRV2: vllm/v1/worker/gpu/</text>
  <text x="660.0" y="1073.0" font-size="11" fill="#475569" text-anchor="middle">env: VLLM_USE_V2_MODEL_RUNNER</text>
  <rect x="865" y="995" width="370" height="110" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="1050.0" y="1019" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Attention backend + Sampler</text>
  <text x="1050.0" y="1040" font-size="11" fill="#475569" text-anchor="middle">FlashAttention / FlashInfer / Triton</text>
  <text x="1050.0" y="1056.5" font-size="11" fill="#475569" text-anchor="middle">model weights + KV cache in HBM</text>
  <text x="1050.0" y="1073.0" font-size="11" fill="#475569" text-anchor="middle">CUDA graph capture / replay</text>
  <line x1="350" y1="176" x2="350" y2="249" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="350" y1="345" x2="350" y2="361" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="350" y1="465" x2="350" y2="481" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="350" y1="580" x2="350" y2="643" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="370" y1="643" x2="370" y2="582" stroke="#059669" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <line x1="1090" y1="176" x2="1090" y2="249" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="1090" y1="345" x2="1090" y2="361" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="1090" y1="465" x2="1090" y2="481" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="1090" y1="580" x2="1090" y2="643" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="1110" y1="643" x2="1110" y2="582" stroke="#059669" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="362" y="216" font-size="11" fill="#475569" text-anchor="start">prompts / batch</text>
  <text x="1080" y="216" font-size="11" fill="#475569" text-anchor="end">HTTP requests / streaming</text>
  <line x1="657" y1="685" x2="657" y2="723" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="679" y1="723" x2="679" y2="687" stroke="#059669" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="694" y="702" font-size="11" fill="#475569" text-anchor="start">EngineCoreRequest (down, ROUTER to DEALER)</text>
  <text x="694" y="719" font-size="11" fill="#475569" text-anchor="start">EngineCoreOutputs (up, PUSH to PULL)</text>
  <line x1="657" y1="925" x2="657" y2="958" stroke="#2563eb" stroke-width="2.0" marker-end="url(#ab)"/>
  <line x1="679" y1="958" x2="679" y2="927" stroke="#059669" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="694" y="945" font-size="11" fill="#475569" text-anchor="start">execute_model()  /  sample()</text>
  <rect x="60" y="1155" width="1320" height="115" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="80" y="1173" width="24" height="10" fill="#2563eb"/>
  <text x="114" y="1182" font-size="11.5" fill="#475569" text-anchor="start">request path (top -> bottom):  prompt -> EngineCoreRequest -> schedule -> execute</text>
  <rect x="80" y="1196" width="24" height="10" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="114" y="1205" font-size="11.5" fill="#475569" text-anchor="start">output path (bottom -> top):  EngineCoreOutputs (PUSH -> PULL) -> detokenize -> RequestOutput -> streaming response</text>
  <rect x="80" y="1219" width="24" height="10" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="114" y="1228" font-size="11.5" fill="#475569" text-anchor="start">control channel: DP coordinator XPUB -> frontend XSUB (stats); no ZMQ on tensors (NCCL / shared memory)</text>
  <text x="80" y="1252" font-size="11.5" fill="#334155" text-anchor="start">Processes:  A API servers (default = DP)  +  DP engine cores  +  N GPU workers (N = DP x PP x TP)   [+1 DP coordinator when DP > 1]</text>
</svg>