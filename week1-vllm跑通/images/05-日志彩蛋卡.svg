<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560"><style>text{font-family:'Noto Sans CJK SC',sans-serif}</style>
<defs><filter id="s1" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00000022"/></filter></defs>
<rect width="1100" height="560" fill="#FDF8EF"/>
<text x="550" y="56" font-size="30" font-weight="700" text-anchor="middle" fill="#333333">日志里的 4 个彩蛋</text>
<text x="550" y="90" font-size="15" text-anchor="middle" fill="#8a8a8a">每个数字背后都藏着一条线索</text>
<g filter="url(#s1)"><rect x="60" y="140" width="490" height="180" rx="20" fill="#E9F1FF" stroke="#2F6BDF" stroke-width="2.5"/></g>
<circle cx="140" cy="230" r="36" fill="#ffffff" stroke="#2F6BDF" stroke-width="3"/>
<rect x="125" y="220" width="19" height="19" rx="4" fill="#2F6BDF"/>
<rect x="137" y="232" width="19" height="19" rx="4" fill="#2F6BDF" opacity="0.65"/>
<text x="200" y="222" font-size="30" font-weight="700" text-anchor="start" fill="#2F6BDF">544 / 784</text>
<text x="200" y="254" font-size="14" text-anchor="start" fill="#4a4a4a">混合注意力的小机关：vLLM 自动把 attention 页</text>
<text x="200" y="278" font-size="13" text-anchor="start" fill="#8a8a8a">调到 ≥ mamba 页再对齐（0.8B → 544，27B → 784）</text>
<g filter="url(#s1)"><rect x="550" y="140" width="490" height="180" rx="20" fill="#F1EBFF" stroke="#7C5CD6" stroke-width="2.5"/></g>
<circle cx="630" cy="230" r="36" fill="#ffffff" stroke="#7C5CD6" stroke-width="3"/>
<circle cx="630" cy="230" r="16" fill="none" stroke="#7C5CD6" stroke-width="3.5"/>
<circle cx="630" cy="230" r="10" fill="none" stroke="#7C5CD6" stroke-width="2"/>
<rect x="624" y="228" width="12" height="4" rx="2" fill="#7C5CD6"/>
<text x="690" y="222" font-size="30" font-weight="700" text-anchor="start" fill="#7C5CD6">12.4 KB / 67 KB</text>
<text x="690" y="254" font-size="14" text-anchor="start" fill="#4a4a4a">每个 token 的 KV 显存单价（0.8B vs 27B）</text>
<text x="690" y="278" font-size="13" text-anchor="start" fill="#8a8a8a">KV cache 不是免费的 —— 这就是显存账</text>
<g filter="url(#s1)"><rect x="60" y="350" width="490" height="180" rx="20" fill="#E9F7EF" stroke="#189A63" stroke-width="2.5"/></g>
<circle cx="140" cy="440" r="36" fill="#ffffff" stroke="#189A63" stroke-width="3"/>
<circle cx="123" cy="432" r="6" fill="none" stroke="#189A63" stroke-width="3"/>
<circle cx="140" cy="427" r="6" fill="none" stroke="#189A63" stroke-width="3"/>
<circle cx="157" cy="432" r="6" fill="none" stroke="#189A63" stroke-width="3"/>
<path d="M114,446 a14,10 0 0,1 18,0" fill="none" stroke="#189A63" stroke-width="3"/>
<path d="M131,449 a17,12 0 0,1 18,0" fill="none" stroke="#189A63" stroke-width="3"/>
<path d="M148,444 a15,10 0 0,1 18,0" fill="none" stroke="#189A63" stroke-width="3"/>
<text x="200" y="432" font-size="30" font-weight="700" text-anchor="start" fill="#189A63">22 路 / 1.14 路</text>
<text x="200" y="464" font-size="14" text-anchor="start" fill="#4a4a4a">262K 超长上下文，一块卡能并发几路？</text>
<text x="200" y="488" font-size="13" text-anchor="start" fill="#8a8a8a">27B 只剩 1 路 → 必须 --max-model-len 限长</text>
<g filter="url(#s1)"><rect x="550" y="350" width="490" height="180" rx="20" fill="#FDEBF3" stroke="#D6336C" stroke-width="2.5"/></g>
<circle cx="630" cy="440" r="36" fill="#ffffff" stroke="#D6336C" stroke-width="3"/>
<path d="M616,424 L644,424 L632,440 Z" fill="none" stroke="#D6336C" stroke-width="3" stroke-linejoin="round"/>
<path d="M616,456 L644,456 L632,440 Z" fill="none" stroke="#D6336C" stroke-width="3" stroke-linejoin="round"/>
<line x1="614" y1="420" x2="646" y2="420" stroke="#D6336C" stroke-width="3" stroke-linecap="round"/>
<line x1="614" y1="460" x2="646" y2="460" stroke="#D6336C" stroke-width="3" stroke-linecap="round"/>
<text x="690" y="432" font-size="30" font-weight="700" text-anchor="start" fill="#D6336C">≈ 3.5 分钟</text>
<text x="690" y="464" font-size="14" text-anchor="start" fill="#4a4a4a">冷启动三件套：torch.compile + 预热 + CUDA graph</text>
<text x="690" y="488" font-size="13" text-anchor="start" fill="#8a8a8a">第一次慢是热身，不是卡死（有缓存后快很多）</text>
<text x="550" y="552" font-size="13.5" text-anchor="middle" fill="#9a9a9a">—— 更多细节见学习报告第 5、6 节 ——</text>
</svg>